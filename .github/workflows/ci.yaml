name: CI

on:
  push:
    branches: [ master ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  pull_request:
    branches: [ master ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-plugin:
        description: Upload the plugin ZIP for a calling job (the release workflow).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Formatting, tooling tests, palette validation, Ghostty/JetBrains/site checks and the plugin.
      - name: Check and build
        run: ./gradlew ktfmtCheck :tooling:build :ports:jetbrains:check :ports:jetbrains:buildPlugin :ports:jetbrains:verifyPluginStructure

      # Only the release workflow needs the ZIP; releases are the durable distribution.
      - name: Upload plugin ZIP
        if: inputs.upload-plugin
        uses: actions/upload-artifact@v7
        with:
          name: catppuccin-iced-americano-jetbrains
          path: ports/jetbrains/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 1
