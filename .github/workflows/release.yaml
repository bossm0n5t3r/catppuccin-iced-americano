name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    with:
      upload-plugin: true

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download plugin ZIP
        uses: actions/download-artifact@v8
        with:
          name: catppuccin-iced-americano-jetbrains
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag must match the plugin version, which names the ZIP.
          zip="dist/catppuccin-iced-americano-jetbrains-${TAG#v}.zip"
          if [[ ! -f $zip ]]; then
            echo "::error::Tag $TAG does not match the plugin version; built: $(ls dist)"
            exit 1
          fi
          # Custom plugin repository for IDE updates, served from releases/latest/download.
          # The ID and since-build come from the built descriptor so they cannot drift.
          jar=$(unzip -Z1 "$zip" | grep -m1 '/lib/.*\.jar$')
          unzip -p "$zip" "$jar" > "$RUNNER_TEMP/plugin.jar"
          descriptor=$(unzip -p "$RUNNER_TEMP/plugin.jar" META-INF/plugin.xml)
          id=$(grep -o -m1 '<id>[^<]*</id>' <<<"$descriptor" | sed 's/<[^>]*>//g')
          since=$(grep -o -m1 'since-build="[^"]*"' <<<"$descriptor" | cut -d'"' -f2)
          if [[ -z $id || -z $since ]]; then
            echo "::error::Plugin ID or since-build missing from $jar"
            exit 1
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${zip##*/}"
          cat > dist/updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="${id}" url="${url}" version="${TAG#v}">
              <idea-version since-build="${since}"/>
            </plugin>
          </plugins>
          EOF
          gh release create "$TAG" "$zip" dist/updatePlugins.xml ports/ghostty/iced-americano \
            --title "$TAG" --generate-notes --verify-tag
