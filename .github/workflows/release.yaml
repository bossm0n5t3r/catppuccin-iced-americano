name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    with:
      upload-plugin: true

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download plugin ZIP
        uses: actions/download-artifact@v8
        with:
          name: catppuccin-iced-americano-jetbrains
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag must match the plugin version, which names the ZIP.
          zip="dist/catppuccin-iced-americano-jetbrains-${TAG#v}.zip"
          if [[ ! -f $zip ]]; then
            echo "::error::Tag $TAG does not match the plugin version; built: $(ls dist)"
            exit 1
          fi
          gh release create "$TAG" "$zip" ports/ghostty/iced-americano \
            --title "$TAG" --generate-notes --verify-tag
