name: JetBrains

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and verify plugin
        run: ./gradlew :tooling:test :tooling:checkJetBrains :ports:jetbrains:check :ports:jetbrains:buildPlugin :ports:jetbrains:verifyPluginStructure

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: catppuccin-iced-americano-jetbrains
          path: ports/jetbrains/build/distributions/*.zip
          if-no-files-found: error
